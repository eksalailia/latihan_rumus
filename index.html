<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Latihan IF COUNTIF SUMIF</title>
<style>
  body { font-family: Arial, sans-serif; background: #11998e; padding: 20px; }
  .box { background: #fff; max-width: 700px; margin: 0 auto; padding: 25px; border-radius: 15px; }
  h1 { color: #11998e; text-align: center; }
  input[type=text] { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  button { background: #11998e; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  button:hover { background: #0d7a70; }
  .hidden { display: none; }
  .info { background: #e8f8f0; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
  .question { background: #f0fdf6; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
  .result { text-align: center; }
  .score { font-size: 48px; font-weight: bold; color: #11998e; }
  .review { background: #f8f8f8; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #ccc; }
  .review.ok { border-left-color: #38ef7d; }
  .review.no { border-left-color: #e74c3c; }
</style>
</head>
<body>
<div class="box">

  <!-- HALAMAN AWAL -->
  <div id="page-start">
    <h1>📝 Latihan IF, COUNTIF, SUMIF</h1>
    <p style="text-align:center;color:#666;">20 soal — tulis rumusmu</p>
    <label>Nama:</label>
    <input type="text" id="in-nama">
    <label>Absen:</label>
    <input type="text" id="in-absen">
    <label>Kelas:</label>
    <input type="text" id="in-kelas">
    <button onclick="mulai()">🚀 Mulai Latihan</button>
  </div>

  <!-- HALAMAN SOAL -->
  <div id="page-quiz" class="hidden">
    <div class="info">
      👤 <b id="show-nama"></b> | 🔢 <b id="show-absen"></b> | 🏫 <b id="show-kelas"></b>
    </div>
    <p>Soal <b id="show-no">1</b> / 20</p>
    <div class="question">
      <p><b id="show-soal"></b></p>
      <p style="font-size:13px;color:#888;">💡 <span id="show-hint"></span></p>
    </div>
    <input type="text" id="in-jawab" placeholder='Contoh: =IF(A1>75,"Lulus","Remedial")'>
    <button onclick="jawab()">✅ Jawab &amp; Lanjut</button>
    <button onclick="lewati()" style="background:#ccc;color:#333;">⏭️ Lewati</button>
  </div>

  <!-- HALAMAN HASIL -->
  <div id="page-result" class="hidden">
    <h1>🎉 Hasil</h1>
    <div class="result">
      <div class="score" id="show-nilai">0</div>
      <p>Benar: <b id="show-benar">0</b> | Salah: <b id="show-salah">0</b></p>
      <p id="show-pesan" style="font-size:16px;"></p>
      <p id="show-status" style="font-size:13px;color:#888;"></p>
    </div>
    <h3>Pembahasan:</h3>
    <div id="show-review"></div>
  </div>

</div>

<iframe name="kirim_frame" style="display:none;"></iframe>
<form id="kirim_form" target="kirim_frame" method="POST" style="display:none;"></form>

<script>
var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbziX39MW-5bH9K9ro1U36alertVK0d2xALiVYeeiKPo2AAdLix49pees7RNl8uyvl6t/exec";

var SOAL = [
  {q:"IF: A1 > 75 → Lulus, else Remedial", h:"=IF(kondisi, benar, salah)", a:["=if(a1>75,\"lulus\",\"remedial\")"], e:"=IF(A1>75,\"Lulus\",\"Remedial\")"},
  {q:"IF: B1 >= 60 → Lulus, else Tidak Lulus", h:"Gunakan >=", a:["=if(b1>=60,\"lulus\",\"tidak lulus\")"], e:"=IF(B1>=60,\"Lulus\",\"Tidak Lulus\")"},
  {q:"IF: C1 < 70 → Remedial, else Lulus", h:"Gunakan <", a:["=if(c1<70,\"remedial\",\"lulus\")"], e:"=IF(C1<70,\"Remedial\",\"Lulus\")"},
  {q:"IF: D1 = Laki-laki → Putra, else Putri", h:"Teks pakai kutip", a:["=if(d1=\"laki-laki\",\"putra\",\"putri\")"], e:"=IF(D1=\"Laki-laki\",\"Putra\",\"Putri\")"},
  {q:"IF: E1 <= 50 → Gagal, else Berhasil", h:"Gunakan <=", a:["=if(e1<=50,\"gagal\",\"berhasil\")"], e:"=IF(E1<=50,\"Gagal\",\"Berhasil\")"},
  {q:"IF: A2 <> Hadir → Tidak Hadir, else Hadir", h:"Operator <>", a:["=if(a2<>\"hadir\",\"tidak hadir\",\"hadir\")"], e:"=IF(A2<>\"Hadir\",\"Tidak Hadir\",\"Hadir\")"},
  {q:"IF: B2 > 90 → Sangat Baik, else Baik", h:"Gunakan >", a:["=if(b2>90,\"sangat baik\",\"baik\")"], e:"=IF(B2>90,\"Sangat Baik\",\"Baik\")"},
  {q:"COUNTIF: hitung A1:A20 yang > 75", h:"COUNTIF kriteria", a:["=countif(a1:a20,\">75\")"], e:"=COUNTIF(A1:A20,\">75\")"},
  {q:"COUNTIF: hitung B1:B15 yang berisi Lulus", h:"Kriteria teks", a:["=countif(b1:b15,\"lulus\")"], e:"=COUNTIF(B1:B15,\"Lulus\")"},
  {q:"COUNTIF: hitung C1:C20 yang < 60", h:"Kriteria <60", a:["=countif(c1:c20,\"<60\")"], e:"=COUNTIF(C1:C20,\"<60\")"},
  {q:"COUNTIF: hitung B1:B30 yang Laki-laki", h:"Kriteria teks", a:["=countif(b1:b30,\"laki-laki\")"], e:"=COUNTIF(B1:B30,\"Laki-laki\")"},
  {q:"COUNTIF: hitung A1:A100 yang >= 80", h:"Kriteria >=80", a:["=countif(a1:a100,\">=80\")"], e:"=COUNTIF(A1:A100,\">=80\")"},
  {q:"COUNTIF: hitung D1:D50 yang = 100", h:"Kriteria angka", a:["=countif(d1:d50,100)","=countif(d1:d50,\"100\")"], e:"=COUNTIF(D1:D50,100)"},
  {q:"COUNTIF: hitung E1:E40 yang <> Tidak Lulus", h:"Operator <>", a:["=countif(e1:e40,\"<>tidak lulus\")"], e:"=COUNTIF(E1:E40,\"<>Tidak Lulus\")"},
  {q:"SUMIF: jumlah B1:B10 jika A1:A10 = Laki-laki", h:"SUMIF 3 argumen", a:["=sumif(a1:a10,\"laki-laki\",b1:b10)"], e:"=SUMIF(A1:A10,\"Laki-laki\",B1:B10)"},
  {q:"SUMIF: jumlah C1:C10 yang > 80", h:"SUMIF 2 argumen", a:["=sumif(c1:c10,\">80\")","=sumif(c1:c10,\">80\",c1:c10)"], e:"=SUMIF(C1:C10,\">80\")"},
  {q:"SUMIF: jumlah B1:B10 jika A1:A10 >= 70", h:"Kriteria >=70", a:["=sumif(a1:a10,\">=70\",b1:b10)"], e:"=SUMIF(A1:A10,\">=70\",B1:B10)"},
  {q:"SUMIF: jumlah D1:D20 jika C1:C20 = Perempuan", h:"Kriteria teks", a:["=sumif(c1:c20,\"perempuan\",d1:d20)"], e:"=SUMIF(C1:C20,\"Perempuan\",D1:D20)"},
  {q:"SUMIF: jumlah B1:B15 jika A1:A15 < 60", h:"Kriteria <60", a:["=sumif(a1:a15,\"<60\",b1:b15)"], e:"=SUMIF(A1:A15,\"<60\",B1:B15)"},
  {q:"SUMIF: jumlah E1:E30 jika D1:D30 = 100", h:"Kriteria angka", a:["=sumif(d1:d30,100,e1:e30)","=sumif(d1:d30,\"100\",e1:e30)"], e:"=SUMIF(D1:D30,100,E1:E30)"}
];

var urut = [];
var jawaban = [];
var idx = 0;
var nama = "", absen = "", kelas = "";
var sudah = false;

function normal(s) {
  if (!s) return "";
  return s.toLowerCase().replace(/\s+/g,"").replace(/;/g,",").replace(/'/g,"\"").trim();
}

function cocok(user, list) {
  var n = normal(user);
  if (!n) return false;
  for (var i = 0; i < list.length; i++) {
    if (normal(list[i]) === n) return true;
  }
  return false;
}

function mulai() {
  nama = document.getElementById('in-nama').value.trim();
  absen = document.getElementById('in-absen').value.trim();
  kelas = document.getElementById('in-kelas').value.trim();

  if (!nama || !absen || !kelas) {
    alert("Isi nama, absen, dan kelas dulu ya!");
    return;
  }

  document.getElementById('show-nama').textContent = nama;
  document.getElementById('show-absen').textContent = absen;
  document.getElementById('show-kelas').textContent = kelas;

  urut = SOAL.slice().sort(function() { return Math.random() - 0.5; });
  jawaban = new Array(urut.length);
  idx = 0;
  sudah = false;

  document.getElementById('page-start').classList.add('hidden');
  document.getElementById('page-quiz').classList.remove('hidden');
  tampil();
}

function tampil() {
  var s = urut[idx];
  document.getElementById('show-no').textContent = (idx + 1);
  document.getElementById('show-soal').textContent = s.q;
  document.getElementById('show-hint').textContent = s.h;
  var inp = document.getElementById('in-jawab');
  inp.value = "";
  inp.disabled = false;
  inp.focus();
  inp.onkeydown = function(e) {
    if (e.key === "Enter") { e.preventDefault(); jawab(); }
  };
}

function jawab() {
  var j = document.getElementById('in-jawab').value.trim();
  if (!j) {
    alert("Tulis dulu rumusmu! Kalau tidak tahu, klik 'Lewati'.");
    return;
  }
  jawaban[idx] = j;
  lanjut();
}

function lewati() {
  jawaban[idx] = null;
  lanjut();
}

function lanjut() {
  document.getElementById('in-jawab').disabled = true;
  setTimeout(function() {
    idx++;
    if (idx < urut.length) tampil();
    else selesai();
  }, 150);
}

function selesai() {
  var benar = 0;
  for (var i = 0; i < urut.length; i++) {
    if (cocok(jawaban[i] || "", urut[i].a)) benar++;
  }
  var nilai = Math.round((benar / urut.length) * 100);

  document.getElementById('page-quiz').classList.add('hidden');
  document.getElementById('page-result').classList.remove('hidden');

  document.getElementById('show-nilai').textContent = nilai;
  document.getElementById('show-benar').textContent = benar;
  document.getElementById('show-salah').textContent = (urut.length - benar);

  var pesan = "";
  if (nilai >= 90) pesan = "🌟 Luar biasa!";
  else if (nilai >= 75) pesan = "👏 Bagus sekali!";
  else if (nilai >= 60) pesan = "💪 Sudah cukup baik!";
  else pesan = "🔥 Jangan patah semangat!";
  document.getElementById('show-pesan').textContent = pesan;

  var area = document.getElementById('show-review');
  area.innerHTML = "";
  for (var i = 0; i < urut.length; i++) {
    var s = urut[i];
    var uj = jawaban[i];
    var ok = cocok(uj || "", s.a);
    var div = document.createElement('div');
    div.className = "review " + (ok ? "ok" : "no");
    var html = "<b>" + (ok ? "✅ BENAR" : "❌ SALAH") + "</b><br>";
    html += "<b>" + (i+1) + ".</b> " + s.q + "<br>";
    html += "Jawabanmu: <code>" + (uj || "(kosong)") + "</code><br>";
    if (!ok) html += "Kunci: <code>" + s.a[0] + "</code><br>";
    html += "<small>💡 " + s.e + "</small>";
    div.innerHTML = html;
    area.appendChild(div);
  }

  kirim(benar, nilai);
}

function kirim(benar, nilai) {
  if (sudah) {
    document.getElementById('show-status').textContent = "✅ Nilai sudah dikirim.";
    return;
  }
  sudah = true;
  document.getElementById('show-status').textContent = "⏳ Mengirim ke Google Sheets...";

  var data = {
    nama: nama,
    absen: absen,
    kelas: kelas,
    nilai: nilai,
    benar: benar,
    total: urut.length
  };

  var form = document.getElementById('kirim_form');
  form.action = URL_SCRIPT;
  form.innerHTML = "";
  var inp = document.createElement('input');
  inp.type = 'hidden';
  inp.name = 'postData';
  inp.value = JSON.stringify(data);
  form.appendChild(inp);
  form.submit();

  setTimeout(function() {
    document.getElementById('show-status').textContent = "✅ Nilai berhasil dikirim ke Google Sheets!";
  }, 1000);
}
</script>
</body>
</html>
